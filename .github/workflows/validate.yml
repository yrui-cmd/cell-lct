name: Validate plugin package

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate-windows-package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "requirements.lock"
      - name: Install locked dependencies
        shell: powershell
        run: py -3 -m pip install --requirement .\requirements.lock
      - name: Validate installable package
        shell: powershell
        run: .\tests\test-package.ps1
      - name: Run Windows end-to-end test
        shell: powershell
        run: .\tests\test-windows-e2e.ps1
      - name: Build and verify release archive
        shell: powershell
        run: |
          .\build-release.ps1 -SkipTests
          $zip = '.\dist\cell-lct-next-v0.2.0.zip'
          $expected = ((Get-Content "$zip.sha256") -split '\s+')[0]
          $actual = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw 'Release SHA256 mismatch.' }
      - uses: actions/upload-artifact@v4
        with:
          name: cell-lct-next-v0.2.0
          path: |
            dist/cell-lct-next-v0.2.0.zip
            dist/cell-lct-next-v0.2.0.zip.sha256
