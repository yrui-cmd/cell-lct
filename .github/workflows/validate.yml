name: Validate plugin package

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate-windows-package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate installable package
        shell: powershell
        run: .\tests\test-package.ps1
